name: On-Demand Weather Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ask-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run bot once
        env:
          TELEGRAM_BOT_TOKEN: "8686902963:AAHjuJbk-IvQUdxQnFeXwkuRcNmEBuWzgDI"
          TELEGRAM_CHAT_ID: "8472729796"
          RUN_ONCE: "1"
        run: |
          python nowcast_telegram.py

      - name: Save bot state if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: update bot state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || {
                git checkout --theirs .tg_offset.json bot_user_state.json 2>/dev/null || true
                git add -A
                git rebase --continue || true
              }
              if git push origin HEAD:main; then
                break
              fi
              sleep 2
            done
          fi
